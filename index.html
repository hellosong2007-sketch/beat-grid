        // คืนองค์ประกอบตามรหัสในหน้าเว็บ
        function byId(id) {
          return document.getElementById(id);
        }

        // ทำสำเนาข้อมูลธรรมดา (ตัวเลข ข้อความ รายการ) เพื่อไม่ให้แก้ของเดิมโดยไม่ตั้งใจ
        function clone(value) {
          return JSON.parse(JSON.stringify(value));
        }

        // แทนที่ {ชื่อ} ในข้อความด้วยค่าที่ให้มา
        function fmt(text, vars) {
          return String(text).replace(/\{(\w+)\}/g, function (all, name) {
            return vars && vars[name] !== undefined ? vars[name] : all;
          });
        }

        // ดึงข้อความภาษาไทยจากตาราง TEXT (ถ้าไม่มีรหัสนั้น คืนรหัสกลับไปให้เห็นว่าขาด)
        function t(key, vars) {
          return TEXT[key] === undefined ? key : fmt(TEXT[key], vars);
        }

        // สร้างองค์ประกอบ HTML พร้อมคุณสมบัติและลูก
        function el(tag, props, kids) {
          var node = document.createElement(tag);
          Object.keys(props || {}).forEach(function (name) {
            if (name === 'text') {
              node.textContent = props.text;
            } else if (name === 'on') {
              Object.keys(props.on).forEach(function (eventName) {
                node.addEventListener(eventName, props.on[eventName]);
              });
            } else {
              node.setAttribute(name, props[name]);
            }
          });
          (kids || []).forEach(function (kid) {
            if (kid) node.appendChild(kid);
          });
          return node;
        }

        // สร้างองค์ประกอบ SVG พร้อมคุณสมบัติและลูก
        function svg(tag, attrs, kids) {
          var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
          Object.keys(attrs || {}).forEach(function (name) {
            if (name === 'text') {
              node.textContent = attrs.text;
            } else {
              node.setAttribute(name, attrs[name]);
            }
          });
          (kids || []).forEach(function (kid) {
            if (kid) node.appendChild(kid);
          });
          return node;
        }

        // ใส่ข้อความภาษาไทยลงในองค์ประกอบที่มี data-t และ data-t-aria
        function applyText() {
          document.querySelectorAll('[data-t]').forEach(function (node) {
            node.textContent = t(node.getAttribute('data-t'));
          });
          document.querySelectorAll('[data-t-aria]').forEach(function (node) {
            node.setAttribute('aria-label', t(node.getAttribute('data-t-aria')));
          });
        }

        // อ่านค่าจากเบราว์เซอร์ ถ้าเก็บไม่ได้ใช้ค่าในหน่วยความจำแทน
        function read(key, fallback) {
          var raw = null;
          try {
            raw = localStorage.getItem(key);
          } catch (e) {
            storageOK = false;
            return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : fallback;
          }
          if (raw === null) return fallback;
          try {
            return JSON.parse(raw);
          } catch (e) {
            return fallback;
          }
        }

        // เก็บค่าในหน่วยความจำและในเบราว์เซอร์
        function write(key, value) {
          memory[key] = value;
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch (e) {
            storageOK = false;
          }
          showStorageNotice();
        }

        // แสดงข้อความครั้งเดียวเมื่อเบราว์เซอร์เก็บสถิติไม่ได้
        function showStorageNotice() {
          byId('notice').textContent = storageOK ? '' : t('storageNotice');
        }

        // ลงทะเบียนผู้รับเหตุการณ์ของเกม
        function on(name, handler) {
          (handlers[name] || (handlers[name] = [])).push(handler);
        }

        // ส่งเหตุการณ์ให้ผู้รับ ถ้าส่วนเสริมของนิสิตพังจะจดไว้และเกมเล่นต่อได้
        function emit(name, detail) {
          (handlers[name] || []).slice().forEach(function (handler) {
            try {
              handler(detail);
            } catch (e) {
              var message = String(e);
              errors.push(message);
              if (!warned[message]) {
                warned[message] = true;
                console.warn(message);
              }
              if (!byId('checkResult').hidden) showCheck();
            }
          });
        }

        // เปลี่ยนหน้าจอ ย้ายโฟกัสไปที่หัวเรื่อง และส่งเหตุการณ์ screenChange
        function showScreen(next) {
          var from = activeScreen;
          activeScreen = next;
          document.querySelectorAll('[data-screen]').forEach(function (screen) {
            screen.hidden = screen.getAttribute('data-screen') !== next;
          });
          var heading = document.querySelector('[data-screen="' + next + '"] h1');
          if (heading) heading.focus();
          if (from !== next) emit('screenChange', { from: from, to: next });
        }

        // แสดงข้อความสั้น ๆ ครั้งละหนึ่งข้อความ
        function showToast(message) {
          clearTimeout(toastTimer);
          var box = byId('toast');
          box.textContent = message;
          box.hidden = false;
          toastTimer = setTimeout(function () {
            box.hidden = true;
          }, CONFIG.toastMs);
        }

        // ปุ่มยืนยันสองขั้น: กดครั้งแรกเปลี่ยนข้อความ กดครั้งที่สองจึงทำจริง (ถ้า skip() เป็นจริงจะทำทันที)
        function twoStep(button, labelKey, confirmKey, action, skip) {
          button.addEventListener('click', function () {
            if (skip && skip()) {
              action();
              return;
            }
            if (confirmTimers[button.id]) {
              clearTimeout(confirmTimers[button.id]);
              delete confirmTimers[button.id];
              button.textContent = t(labelKey);
              action();
              return;
            }
            button.textContent = t(confirmKey);
            confirmTimers[button.id] = setTimeout(function () {
              delete confirmTimers[button.id];
              button.textContent = t(labelKey);
            }, CONFIG.confirmMs);
          });
        }

        // ปรับข้อมูลที่เก็บไว้ให้มีรูปแบบเดียวกับค่าเริ่มต้น ส่วนที่เสียหายใช้ค่าเริ่มต้นแทน
        function sanitize(stored, defaults) {
          var out = {};
          Object.keys(defaults).forEach(function (key) {
            var fallback = defaults[key];
            var value = stored && typeof stored === 'object' ? stored[key] : undefined;
            var isObject = fallback !== null && typeof fallback === 'object' && !Array.isArray(fallback);
            var fits = Array.isArray(fallback)
              ? Array.isArray(value)
              : isObject
                ? value !== null && typeof value === 'object' && !Array.isArray(value)
                : typeof value === typeof fallback;
            out[key] = fits ? value : clone(fallback);
          });
          return out;
        }

        // โหลดสถิติและการตั้งค่า ถ้าข้อมูลเสียหายใช้ค่าเริ่มต้น
        function loadAll() {
          stats = sanitize(read(STORE.stats, null), STATS_DEFAULT);
          stats.badges = stats.badges.filter(function (id) {
            return typeof id === 'string';
          });
          settings = sanitize(read(STORE.settings, null), SETTINGS_DEFAULT);
          settings.volume = Math.max(0, Math.min(100, Number(settings.volume) || 0));
          if (['auto', 'light', 'dark'].indexOf(settings.theme) === -1) settings.theme = 'auto';
        }

        // บันทึกสถิติ
        function saveStats() {
          write(STORE.stats, stats);
        }

        // บันทึกการตั้งค่า
        function saveSettings() {
          write(STORE.settings, settings);
        }

        // ใช้ธีมและการลดการเคลื่อนไหวตามที่ตั้งไว้
        function applyOptions() {
          var root = document.documentElement;
          if (settings.theme === 'light' || settings.theme === 'dark') {
            root.setAttribute('data-theme', settings.theme);
          } else {
            root.removeAttribute('data-theme');
          }
          root.setAttribute('data-reduce', settings.reduceMotion ? 'true' : 'false');
        }

        // ถามว่าควรลดการเคลื่อนไหวหรือไม่ (ตั้งในเกมหรือตั้งที่ระบบ)
        function motionReduced() {
          var system =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          return Boolean(settings.reduceMotion || system);
        }

        // เตรียมเครื่องเสียงหลังผู้เล่นแตะครั้งแรก ถ้าทำไม่ได้ เกมยังเล่นแบบไม่มีเสียงได้
        function initAudio() {
          if (audio) {
            if (audio.resume) audio.resume().catch(function () {});
            return;
          }
          var Context = window.AudioContext || window.webkitAudioContext;
          if (!Context || audioFailed) return;
          try {
            audio = new Context();
            master = audio.createGain();
            master.gain.value = CONFIG.masterGain;
            master.connect(audio.destination);
            if (audio.resume) audio.resume().catch(function () {});
          } catch (e) {
            audio = null;
            master = null;
            audioFailed = true;
          }
        }

        // ถามว่าเครื่องนี้เล่นเสียงได้หรือไม่
        function audioAvailable() {
          return Boolean(window.AudioContext || window.webkitAudioContext) && !audioFailed;
        }

        // เล่นเสียงหนึ่งตัวตามความถี่ ความยาว และเวลาเริ่ม (วินาทีนับจากตอนนี้)
        function playTone(hz, durSec, whenSec, wave) {
          if (!audio || !master) return;
          try {
            var level = settings.volume / 100;
            var start = audio.currentTime + (whenSec || 0);
            var attack = CONFIG.audioAttackSec;
            var release = Math.min(CONFIG.audioReleaseSec, durSec / 2);
            var osc = audio.createOscillator();
            var gain = audio.createGain();
            osc.type = wave || 'triangle';
            osc.frequency.value = hz;
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(level, start + attack);
            gain.gain.setValueAtTime(level, start + Math.max(attack, durSec - release));
            gain.gain.linearRampToValueAtTime(0, start + durSec);
            osc.connect(gain);
            gain.connect(master);
            osc.start(start);
            osc.stop(start + durSec + 0.02);
          } catch (e) {
            /* เล่นเสียงไม่ได้ก็เล่นเกมต่อแบบเงียบ */
          }
        }

        // ทำให้เวลาเป็นข้อความ เช่น 1:05
        function formatTime(ms) {
          var total = Math.max(0, Math.round(ms / 1000));
          var minutes = Math.floor(total / 60);
          var seconds = total % 60;
          return minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        }

        // แสดงตัวเลขคะแนนที่ลอยขึ้นข้างค่าที่เปลี่ยน
        function popScore(anchor, delta) {
          if (!anchor || !delta || motionReduced()) return;
          var pop = el('span', { class: 'score-pop', 'aria-hidden': 'true', text: '+' + delta });
          anchor.appendChild(pop);
          setTimeout(function () {
            if (pop.parentNode) pop.parentNode.removeChild(pop);
          }, CONFIG.popMs);
        }

        // นับตัวเลขขึ้นจาก 0 ถึงค่าสุดท้าย ถ้าลดการเคลื่อนไหวให้แสดงค่าสุดท้ายทันที
        function countUp(node, value) {
          node.setAttribute('data-value', String(value));
          if (motionReduced() || value <= 0) {
            node.textContent = String(value);
            return;
          }
          var steps = 10;
          var step = 0;
          node.textContent = '0';
          var timer = setInterval(function () {
            step += 1;
            node.textContent = String(Math.round((value * step) / steps));
            if (step >= steps) clearInterval(timer);
          }, CONFIG.countUpMs / steps);
        }

        // ให้บรรทัดในหน้าสรุปค่อย ๆ ปรากฏตามลำดับ
        function revealRows(container) {
          Array.prototype.forEach.call(container.children, function (child, index) {
            child.style.setProperty('--row', index);
          });
          container.classList.remove('is-revealed');
          setTimeout(function () {
            container.classList.add('is-revealed');
          }, 20);
        }

        // วาดเหรียญหนึ่งเหรียญ เหรียญที่ได้แล้วมีพื้น เหรียญที่ยังไม่ได้เป็นเส้นประ
        function drawMedal(badge) {
          var earned = stats.badges.indexOf(badge.id) !== -1;
          var state = earned ? t('badgeHad') : t('badgeNot');
          var icon = svg(
            'svg',
            {
              viewBox: '0 0 32 32',
              role: 'img',
              class: earned ? 'medal-earned' : 'medal-open',
              'aria-label': badge.name + ' · ' + badge.hint + ' · ' + state
            },
            [
              svg('path', {
                d: 'M10 2l6 10l6-10',
                fill: 'none',
                stroke: 'currentColor',
                'stroke-width': 2,
                'stroke-linejoin': 'round'
              }),
              svg('circle', {
                cx: 16,
                cy: 20,
                r: 9,
                fill: 'none',
                stroke: 'currentColor',
                'stroke-width': 2,
                'stroke-dasharray': earned ? '0' : '3 3'
              }),
              earned
                ? svg('path', {
                    d: 'M11.5 20l3 3l6-6',
                    fill: 'none',
                    stroke: 'currentColor',
                    'stroke-width': 2,
                    'stroke-linecap': 'round'
                  })
                : null
            ]
          );
          icon.appendChild(svg('title', { text: badge.name + ' · ' + badge.hint }));
          return icon;
        }

        // วาดแถวเหรียญบนหน้าแรกและรายการเหรียญ
        function renderMedals() {
          var row = byId('homeBadges');
          row.textContent = '';
          BADGES.forEach(function (badge) {
            row.appendChild(drawMedal(badge));
          });
          var list = byId('badgeList');
          list.textContent = '';
          BADGES.forEach(function (badge) {
            var earned = stats.badges.indexOf(badge.id) !== -1;
            var text = el('div', {}, [
              el('strong', { text: badge.name }),
              el('div', { class: 'soft small', text: badge.hint + ' · ' + (earned ? t('badgeHad') : t('badgeNot')) })
            ]);
            list.appendChild(el('li', {}, [drawMedal(badge), text]));
          });
        }

        // ตรวจเหรียญหลังจบเกม แล้วแจ้งเหรียญใหม่ คืนรายการเหรียญใหม่
        function awardBadges(result) {
          var fresh = BADGES.filter(function (badge) {
            if (stats.badges.indexOf(badge.id) !== -1) return false;
            var rule = Core.badgeRules[badge.test];
            try {
              return Boolean(rule && rule(badge.value, result, stats, DATA));
            } catch (e) {
              return false;
            }
          });
          fresh.forEach(function (badge) {
            stats.badges.push(badge.id);
            emit('badgeEarned', { id: badge.id, name: badge.name });
          });
          if (fresh.length) {
            saveStats();
            renderMedals();
            showToast(
              fresh.length === 1 ? t('badgeToast', { name: fresh[0].name }) : t('badgeAllDone', { n: fresh.length })
            );
          }
          return fresh;
        }

        // วาดขั้นตอนวิธีเล่น แต่ละขั้นมีรูปเล็ก ๆ กับหนึ่งประโยค
        function renderHowto() {
          var list = byId('instructions');
          list.textContent = '';
          [1, 2, 3, 4].forEach(function (index) {
            list.appendChild(el('li', {}, [howtoIcon(index), el('span', { text: t('howto' + index) })]));
          });
        }

        // เปิดหน้าวิธีเล่น และจำไว้ว่าเคยเห็นแล้วเมื่อปิด
        function closeHowto() {
          if (!stats.seenHowto) {
            stats.seenHowto = true;
            saveStats();
          }
          showScreen('home');
        }

        // สรุปผลการตรวจระบบเป็น { passed, failed, results }
        function runSelfCheck() {
          var results = CORE_TESTS.map(function (test) {
            try {
              test.run();
              return { name: test.name, ok: true, detail: '' };
            } catch (e) {
              return { name: test.name, ok: false, detail: String(e && e.message ? e.message : e) };
            }
          });
          var failed = results.filter(function (item) {
            return !item.ok;
          }).length;
          return { passed: results.length - failed, failed: failed, results: results };
        }

        // แสดงผลตรวจระบบในหน้าเว็บ ใช้ข้อความ ผ่าน/ไม่ผ่าน ไม่ใช้สีอย่างเดียว
        function showCheck() {
          var report = runSelfCheck();
          var box = byId('checkResult');
          box.hidden = false;
          box.textContent = '';
          box.appendChild(
            el('p', {
              class: report.failed ? 'is-fail' : 'is-pass',
              text: report.failed
                ? '× ' + t('selfCheckFail', { k: report.failed })
                : '✓ ' + t('selfCheckPass', { n: report.passed, m: report.results.length })
            })
          );
          var list = el('ul');
          report.results.forEach(function (item) {
            var mark = item.ok ? t('markPass') : t('markFail');
            list.appendChild(el('li', { text: mark + ' · ' + item.name + (item.detail ? ' · ' + item.detail : '') }));
          });
          box.appendChild(list);
          box.appendChild(el('p', { class: 'small', text: countsLine() + ' · ' + storageLine() }));
          extraCheckLines().forEach(function (line) {
            box.appendChild(el('p', { class: 'small', text: line }));
          });
          errors.forEach(function (message) {
            box.appendChild(el('p', { class: 'is-fail', text: t('extensionLine', { error: message }) }));
          });
        }

        // บอกว่าเบราว์เซอร์เก็บสถิติได้หรือไม่
        function storageLine() {
          return storageOK ? t('storageOk') : t('storageBlocked');
        }

        // ผูกปุ่มและช่องตั้งค่าที่ทุกเกมมีเหมือนกัน
        function bindSharedControls() {
          byId('openHowto').addEventListener('click', function () {
            showScreen('howto');
          });
          byId('closeHowto').addEventListener('click', closeHowto);
          byId('openBadges').addEventListener('click', function () {
            showScreen('badges');
          });
          byId('closeBadges').addEventListener('click', function () {
            goTo('home');
          });
          byId('volume').value = settings.volume;
          byId('volume').addEventListener('input', function () {
            settings.volume = Number(this.value);
            saveSettings();
          });
          byId('testSound').addEventListener('click', function () {
            initAudio();
            playTone(440, 0.4, 0);
          });
          byId('theme').value = settings.theme;
          byId('theme').addEventListener('change', function () {
            settings.theme = this.value;
            applyOptions();
            saveSettings();
          });
          byId('reduce').checked = settings.reduceMotion;
          byId('reduce').addEventListener('change', function () {
            settings.reduceMotion = this.checked;
            applyOptions();
            saveSettings();
          });
          byId('check').addEventListener('click', showCheck);
          twoStep(byId('clearData'), 'btnClearData', 'btnClearDataConfirm', function () {
            [STORE.stats, STORE.settings].concat(STORE.extra || []).forEach(function (key) {
              delete memory[key];
              try {
                localStorage.removeItem(key);
              } catch (e) {
                storageOK = false;
              }
            });
            loadAll();
            applyOptions();
            renderMedals();
            resetAfterClear();
          });
        }
        /* ── ส่วนเฉพาะของกล่องจังหวะ ── */
        var STORE = {
          stats: 'beat-grid-stats-v1',
          settings: 'beat-grid-settings-v1',
          pattern: 'beat-grid-pattern-v1',
          extra: ['beat-grid-pattern-v1']
        };
        var STATS_DEFAULT = { best: {}, badges: [], solved: [], freePlays: 0, seenHowto: false };
        var SETTINGS_DEFAULT = {
          volume: CONFIG.defaultVolumePercent,
          theme: 'auto',
          reduceMotion: false,
          mode: 'free',
          level: 'easy'
        };
        var DATA = {
          TRACKS: TRACKS,
          GROOVES: GROOVES,
          LEVELS: LEVELS,
          MODES: MODES,
          BADGES: BADGES,
          COUNT_SYLLABLES: COUNT_SYLLABLES,
          TEXT: TEXT
        };
        var game = null;
        var lastResult = null;
        var grid = null;
        var bpm = CONFIG.bpmDefault;
        var trackIds = [];
        var cellEls = {};
        var labelEls = [];
        var marks = {};
        var playback = null;
        var frameId = 0;
        var hitTimers = {};
        var noiseBuffer = null;
        var noiseOwner = null;
        var freeDirty = false;
        var locked = false;
        var nowStep = -1;
        var focusTrack = 0;
        var focusStep = 0;
        var presetId = '';

        // ข้อความนับจำนวนข้อมูลในตารางของเกม สำหรับแสดงในหน้าตรวจระบบ
        function countsLine() {
          var perLevel = [1, 2, 3]
            .map(function (level) {
              return validGrooves().filter(function (groove) {
                return groove.level === level;
              }).length;
            })
            .join('/');
          return [
            t('cntTracks', { n: TRACKS.length }),
            t('cntGrooves', { n: validGrooves().length }) + ' (' + perLevel + ')',
            t('cntModes', { n: MODES.length }),
            t('cntBadges', { n: BADGES.length }),
            t('cntScreens', { n: document.querySelectorAll('[data-screen]').length })
          ].join(' · ');
        }

        // ข้อความเพิ่มเติมในหน้าตรวจระบบ: จังหวะที่ใช้ไม่ได้และเหตุผล
        function extraCheckLines() {
          var ids = TRACKS.map(function (track) {
            return track.id;
          });
          return GROOVES.map(function (groove) {
            return { groove: groove, problems: Core.validateGroove(groove, ids, CONFIG.stepsPerBeat) };
          })
            .filter(function (item) {
              return item.problems.length > 0;
            })
            .map(function (item) {
              return t('grooveSkipped', { id: item.groove.id, problem: item.problems.join(', ') });
            });
        }

        // รูปประกอบของแต่ละขั้นในหน้าวิธีเล่น
        function howtoIcon(index) {
          var line = { fill: 'none', stroke: 'currentColor', 'stroke-width': 2.4, 'stroke-linecap': 'round' };
          function shape(tag, attrs) {
            return svg(tag, Object.assign({}, line, attrs));
          }
          function block(x, y, filled) {
            return svg('rect', {
              x: x,
              y: y,
              width: 12,
              height: 12,
              rx: 2,
              fill: filled ? 'currentColor' : 'none',
              stroke: 'currentColor',
              'stroke-width': 2.4
            });
          }
          var parts = [
            [block(8, 8, true), block(24, 8, false), block(40, 8, false), block(8, 24, false), block(24, 24, true)],
            [block(8, 12, true), block(24, 12, false), block(24, 28, true), shape('path', { d: 'M12 44h32' })],
            [shape('path', { d: 'M10 40V16M10 16l22 8M10 32l22-8' }), block(36, 32, true)],
            [shape('path', { d: 'M10 40l10-16l10 8l16-20' }), shape('path', { d: 'M38 12h8v8' })]
          ];
          return svg('svg', { viewBox: '0 0 56 56', 'aria-hidden': 'true' }, parts[index - 1]);
        }

        // จังหวะที่ใช้ได้ (ผ่านการตรวจ) จังหวะที่เสียจะถูกข้ามและไปรายงานในหน้าตรวจระบบ
        function validGrooves() {
          var ids = TRACKS.map(function (track) {
            return track.id;
          });
          return GROOVES.filter(function (groove) {
            return Core.validateGroove(groove, ids, CONFIG.stepsPerBeat).length === 0;
          });
        }

        // หาแถวเสียงจากรหัส
        function trackById(id) {
          return (
            TRACKS.filter(function (track) {
              return track.id === id;
            })[0] || null
          );
        }

        // รหัสแถวเสียงทั้งหมดตามลำดับในตาราง TRACKS
        function allTrackIds() {
          return TRACKS.map(function (track) {
            return track.id;
          });
        }

        // ค่าสีของแถวเสียงในรูป CSS (ถ้าไม่มีตัวแปรสีนั้นใช้สีฟ้า)
        function colorFor(track) {
          return 'var(' + track.colorVar + ', var(--blue))';
        }

        // จอกว้างพอให้เวลาไหลไปทางขวาหรือไม่
        function isWide() {
          return typeof window.matchMedia === 'function' && window.matchMedia('(min-width: 720px)').matches;
        }

        // จำนวนช่องในหนึ่งห้อง
        function stepCount() {
          return grid.beats * CONFIG.stepsPerBeat;
        }

        // ระดับที่เลือกอยู่
        function currentLevel() {
          return (
            LEVELS.filter(function (level) {
              return level.id === settings.level;
            })[0] || LEVELS[0]
          );
        }

        // ตรวจว่าโหมดและระดับที่เก็บไว้ยังใช้ได้ ถ้าไม่ได้ใช้ค่าเริ่มต้น
        function validateChoices() {
          if (!MODES.some(function (mode) { return mode.id === settings.mode; })) settings.mode = 'free';
          if (!LEVELS.some(function (level) { return level.id === settings.level; })) settings.level = LEVELS[0].id;
        }

        // ความเร็วที่อยู่ในช่วงของแถบเลื่อน
        function clampBpm(value) {
          var number = Number(value);
          if (!isFinite(number)) return CONFIG.bpmDefault;
          return Math.max(CONFIG.bpmMin, Math.min(CONFIG.bpmMax, Math.round(number)));
        }

        // เก็บจังหวะที่ผู้เล่นสร้างเอง (เฉพาะโหมดสร้างเอง)
        function saveFreePattern() {
          if (game && game.mode === 'free') write(STORE.pattern, Core.gridToSaved(grid, bpm));
        }

        // ระบายสีและข้อความของช่องหนึ่งช่องให้ตรงกับตาราง
        function renderCell(id, step) {
          var node = cellEls[id + ':' + step];
          if (!node) return;
          var on = grid.rows[id][step] === true;
          var mark = marks[id + ':' + step] || '';
          node.classList.toggle('is-on', on);
          node.classList.toggle('is-extra', mark === 'extra');
          node.classList.toggle('is-missing', mark === 'missing');
          node.setAttribute('aria-pressed', on ? 'true' : 'false');
          var text = mark === 'extra' ? TEXT.markExtra : mark === 'missing' ? TEXT.markMissing : on ? '●' : '';
          node.querySelector('.cell-mark').textContent = text;
          var label = t('cellLabel', {
            track: trackById(id).label,
            count: Core.stepName(step, CONFIG.stepsPerBeat, COUNT_SYLLABLES),
            state: on ? TEXT.cellOn : TEXT.cellOff
          });
          node.setAttribute('aria-label', mark ? label + ' · ' + text : label);
        }

        // วาดทุกช่องใหม่
        function renderCells() {
          trackIds.forEach(function (id) {
            for (var step = 0; step < stepCount(); step++) renderCell(id, step);
          });
        }

        // ย้ายจุดที่ปุ่มแท็บเข้าถึงไปที่ช่องหนึ่ง
        function setFocusCell(trackIndex, step) {
          focusTrack = trackIndex;
          focusStep = step;
          Object.keys(cellEls).forEach(function (key) {
            cellEls[key].setAttribute('tabindex', '-1');
          });
          var node = cellEls[trackIds[trackIndex] + ':' + step];
          if (node) node.setAttribute('tabindex', '0');
        }

        // สร้างตารางใหม่ทั้งหมดตามแถวเสียงและจำนวนจังหวะ (โครงเดียว จอแคบกับจอกว้างต่างกันแค่ CSS)
        function buildGrid() {
          var host = byId('grid');
          host.textContent = '';
          cellEls = {};
          labelEls = [];
          nowStep = -1;
          var perBeat = CONFIG.stepsPerBeat;
          var steps = stepCount();
          host.style.setProperty('--tracks', trackIds.length);
          host.style.setProperty('--steps', steps);
          host.appendChild(el('div', { class: 'grid-corner' }));
          trackIds.forEach(function (id, index) {
            var track = trackById(id);
            var style = '--t:' + index + ';--track-color:' + colorFor(track);
            host.appendChild(el('div', { class: 'track-head', style: style, text: track.label }));
          });
          for (var step = 0; step < steps; step++) {
            var beatStart = step % perBeat === 0;
            var labelText = beatStart ? String(step / perBeat + 1) : COUNT_SYLLABLES[step % perBeat];
            var label = el('div', {
              class: 'step-label' + (beatStart ? ' is-beat' : ''),
              style: '--s:' + step,
              'aria-hidden': 'true',
              text: labelText
            });
            labelEls.push(label);
            host.appendChild(label);
            trackIds.forEach(function (id, index) {
              var style = '--s:' + step + ';--t:' + index + ';--track-color:' + colorFor(trackById(id));
              var cell = el('button', {
                type: 'button',
                class: 'cell' + (beatStart ? ' is-beat' : ''),
                style: style,
                tabindex: '-1',
                'data-track': id,
                'data-step': step
              }, [el('span', { class: 'cell-mark', 'aria-hidden': 'true' })]);
              cell.addEventListener('click', function () {
                toggleCell(id, Number(cell.getAttribute('data-step')));
              });
              cellEls[id + ':' + step] = cell;
              host.appendChild(cell);
            });
          }
          setFocusCell(Math.min(focusTrack, trackIds.length - 1), Math.min(focusStep, steps - 1));
          renderCells();
        }

        // ใช้ปุ่มลูกศรเลื่อนระหว่างช่อง (ทิศของเวลาเปลี่ยนตามขนาดจอ)
        function onGridKey(event) {
          var wide = isWide();
          var dTrack = 0;
          var dStep = 0;
          if (event.key === 'ArrowRight') {
            if (wide) dStep = 1;
            else dTrack = 1;
          } else if (event.key === 'ArrowLeft') {
            if (wide) dStep = -1;
            else dTrack = -1;
          } else if (event.key === 'ArrowDown') {
            if (wide) dTrack = 1;
            else dStep = 1;
          } else if (event.key === 'ArrowUp') {
            if (wide) dTrack = -1;
            else dStep = -1;
          } else {
            return;
          }
          event.preventDefault();
          var nextTrack = Math.max(0, Math.min(trackIds.length - 1, focusTrack + dTrack));
          var nextStep = Math.max(0, Math.min(stepCount() - 1, focusStep + dStep));
          setFocusCell(nextTrack, nextStep);
          cellEls[trackIds[nextTrack] + ':' + nextStep].focus();
        }

        // แตะช่อง: วางหรือเอาเสียงออก
        function toggleCell(id, step) {
          if (!game || locked) return;
          initAudio();
          var index = trackIds.indexOf(id);
          setFocusCell(index, step);
          grid = Core.toggle(grid, id, step);
          delete marks[id + ':' + step];
          renderCell(id, step);
          var on = grid.rows[id][step] === true;
          if (on && !playback) playHit(id, 0);
          emit('cellToggle', { trackId: id, step: step, on: on });
          if (game.mode === 'free') {
            freeDirty = true;
            presetId = '';
            byId('presets').value = '';
            byId('presetAbout').textContent = '';
            saveFreePattern();
            renderStrip();
          }
        }

        // ล้างเครื่องหมายเกิน/ขาดทั้งตาราง
        function clearMarks() {
          marks = {};
          byId('roundCheck').textContent = '';
          byId('roundCheck').className = 'round-check';
        }

        // ไฮไลต์ช่องที่กำลังเล่น (ถ้าไม่มี step = -1)
        function showPlayhead(step) {
          if (nowStep >= 0) {
            if (labelEls[nowStep]) labelEls[nowStep].classList.remove('is-now');
            trackIds.forEach(function (id) {
              var old = cellEls[id + ':' + nowStep];
              if (old) old.classList.remove('is-now');
            });
          }
          nowStep = step;
          if (step < 0) return;
          if (labelEls[step]) labelEls[step].classList.add('is-now');
          trackIds.forEach(function (id) {
            var node = cellEls[id + ':' + step];
            if (node) node.classList.add('is-now');
          });
        }

        // ให้ช่องที่เพิ่งส่งเสียงกะพริบชั่วครู่
        function flashHit(id, step) {
          var node = cellEls[id + ':' + step];
          if (!node) return;
          var key = id + ':' + step;
          clearTimeout(hitTimers[key]);
          node.classList.add('is-hit');
          hitTimers[key] = setTimeout(function () {
            node.classList.remove('is-hit');
          }, CONFIG.hitFlashMs);
        }

        // เสียงสุ่มขาวยาวหนึ่งวินาที สร้างด้วยโค้ดหนึ่งครั้งต่อเครื่องเสียง (ไม่ใช้ไฟล์เสียง)
        function getNoise() {
          if (noiseBuffer && noiseOwner === audio) return noiseBuffer;
          noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
          var data = noiseBuffer.getChannelData(0);
          for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
          noiseOwner = audio;
          return noiseBuffer;
        }

        // ซองเสียงของกลองหนึ่งครั้ง: ขึ้นเร็วมาก แล้วลดลงจนเงียบ ต่อเข้าเครื่องเสียงหลัก
        function drumEnvelope(start, decay, peak) {
          var gain = audio.createGain();
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(peak, start + 0.002);
          gain.gain.linearRampToValueAtTime(0, start + decay);
          gain.connect(master);
          return gain;
        }

        // เล่นเสียงกลองของแถวหนึ่ง (whenSec คือวินาทีนับจากตอนนี้) ทำงานได้เมื่อมีเครื่องเสียงเท่านั้น
        function playHit(trackId, whenSec) {
          if (!audio || !master) return;
          var track = trackById(trackId);
          if (!track) return;
          try {
            var start = audio.currentTime + (whenSec || 0);
            var decay = track.decaySec || 0.1;
            var level = settings.volume / 100;
            if (track.kind === 'kick') {
              var kick = audio.createOscillator();
              kick.type = 'sine';
              kick.frequency.setValueAtTime(track.hz, start);
              kick.frequency.exponentialRampToValueAtTime(track.endHz || 40, start + decay);
              kick.connect(drumEnvelope(start, decay, level));
              kick.start(start);
              kick.stop(start + decay + 0.02);
            } else if (track.kind === 'noise') {
              var source = audio.createBufferSource();
              source.buffer = getNoise();
              var filter = audio.createBiquadFilter();
              filter.type = track.filterHz >= 4000 ? 'highpass' : 'bandpass';
              filter.frequency.value = track.filterHz;
              source.connect(filter);
              filter.connect(drumEnvelope(start, decay, level));
              source.start(start);
              source.stop(start + decay + 0.02);
              if (track.toneHz) {
                var body = audio.createOscillator();
                body.type = 'triangle';
                body.frequency.value = track.toneHz;
                body.connect(drumEnvelope(start, decay, level / 2));
                body.start(start);
                body.stop(start + decay + 0.02);
              }
            } else {
              var tone = audio.createOscillator();
              tone.type = 'triangle';
              tone.frequency.value = track.hz;
              tone.connect(drumEnvelope(start, decay, level));
              tone.start(start);
              tone.stop(start + decay + 0.02);
            }
          } catch (e) {
            /* เล่นเสียงไม่ได้ก็เล่นเกมต่อแบบเงียบ */
          }
        }

        // เล่นตารางตามเวลาจริง ตั้งเสียงล่วงหน้าเล็กน้อยและเลื่อนไฮไลต์เมื่อถึงเวลา
        // เวลาอ้างอิงคือ performance.now ไม่ใช่นาฬิกาเสียง ถ้าไม่มีเสียงก็ยังเดินครบ
        // source คือ 'mine' (ตารางของผู้เล่น วนไม่รู้จบ) หรือ 'target' (โจทย์ เล่น loops ห้อง)
        function startPlayback(source, getGrid, loops, done) {
          stopPlayback('restart');
          var first = getGrid();
          playback = {
            source: source,
            getGrid: getGrid,
            loops: loops,
            done: done,
            stepMs: Core.stepMs(bpm, CONFIG.stepsPerBeat),
            startMs: performance.now(),
            soundNext: 0,
            tickNext: 0
          };
          emit('playStart', { source: source, bpm: bpm, beats: first.beats });
          updateTransport();
          frameId = requestAnimationFrame(playbackFrame);
        }

        // Metronome: audible even when the drum pattern is empty.
        // Connect directly to the output, since the drum master is intentionally quiet.
        function playMetronomeClick(whenSec, accent, preview) {
          if (!audio || (!metronomeEnabled && !preview)) return;
          try {
            var start = audio.currentTime + Math.max(0, whenSec || 0);
            var osc = audio.createOscillator();
            var gain = audio.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(accent ? 1200 : 850, start);
            var volume = Math.max(0, Math.min(1, metronomeVolume / 100));
            var peak = volume * (accent ? 0.32 : 0.23);
            if (peak <= 0) return;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(peak, start + 0.002);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.045);
            osc.connect(gain);
            gain.connect(audio.destination);
            osc.start(start);
            osc.stop(start + 0.055);
          } catch (e) { /* Audio may be unavailable in this browser */ }
        }

        // ทุกเฟรมของการเล่น
        function playbackFrame() {
          if (!playback) return;
          var p = playback;
          var elapsed = performance.now() - p.startMs;
          var current = p.getGrid();
          var steps = current.beats * CONFIG.stepsPerBeat;
          var total = p.loops ? p.loops * steps : Infinity;
          function timeOf(n) {
            return n * p.stepMs;
          }
          while (p.soundNext < total && timeOf(p.soundNext) + CONFIG.maxLateMs < elapsed) p.soundNext += 1;
          while (p.tickNext < total && timeOf(p.tickNext) + CONFIG.maxLateMs < elapsed) p.tickNext += 1;
          var horizon = elapsed + CONFIG.lookaheadMs;
          var due = [];
          while (p.soundNext < total && timeOf(p.soundNext) <= horizon) {
            due.push(p.soundNext);
            p.soundNext += 1;
          }
          var late = due.filter(function (n) {
            return timeOf(n) < elapsed;
          });
          due.forEach(function (n) {
            if (late.length > 1 && timeOf(n) < elapsed && n !== late[late.length - 1]) return;
            var when = Math.max(0, (timeOf(n) - elapsed) / 1000);
            if (n % CONFIG.stepsPerBeat === 0) playMetronomeClick(when, n % steps === 0);
            Core.hitsAt(current, n % steps).forEach(function (id) {
              playHit(id, when);
            });
          });
          while (p.tickNext < total && timeOf(p.tickNext) <= elapsed) {
            tickStep(p, current, steps, p.tickNext);
            p.tickNext += 1;
          }
          if (elapsed >= timeOf(total)) {
            stopPlayback('end');
          } else {
            frameId = requestAnimationFrame(playbackFrame);
          }
        }

        // ถึงเวลาของช่องที่ n: เลื่อนไฮไลต์ กะพริบช่องที่ส่งเสียง และส่งเหตุการณ์
        function tickStep(p, current, steps, n) {
          var step = n % steps;
          if (step === 0 && n > 0) emit('loopEnd', { loops: n / steps });
          var hits = Core.hitsAt(current, step);
          showPlayhead(step);
          if (p.source === 'mine') {
            hits.forEach(function (id) {
              flashHit(id, step);
            });
          }
          emit('stepTick', {
            step: step,
            beat: Math.floor(step / CONFIG.stepsPerBeat) + 1,
            isBeatStart: step % CONFIG.stepsPerBeat === 0,
            hits: hits
          });
        }

        // หยุดการเล่น reason คือ 'end' (เล่นครบ) 'stop' (ผู้เล่นหยุด) หรือ 'restart' (กำลังจะเริ่มใหม่)
        function stopPlayback(reason) {
          if (!playback) return;
          var p = playback;
          cancelAnimationFrame(frameId);
          playback = null;
          showPlayhead(-1);
          if (reason === 'end' && p.loops) emit('loopEnd', { loops: p.loops });
          if (reason !== 'restart') emit('playStop', { source: p.source });
          updateTransport();
          if (reason === 'end' && p.done) p.done();
        }

        // ปรับปุ่มเล่น/หยุดและข้อความความเร็ว
        function updateTransport() {
          var playing = Boolean(playback);
          var mineOn = playing && playback.source === 'mine';
          byId('playMine').textContent = mineOn ? TEXT.btnStop : TEXT.btnPlayMine;
          byId('playMine').setAttribute('aria-pressed', mineOn ? 'true' : 'false');
          byId('tempoText').textContent = t('tempoLabel', { bpm: bpm });
          var slider = byId('tempo');
          slider.value = bpm;
        }

        // เปลี่ยนความเร็วระหว่างเล่นโดยไม่ให้ช่องกระโดด
        function retime() {
          if (!playback) return;
          playback.stepMs = Core.stepMs(bpm, CONFIG.stepsPerBeat);
          playback.startMs = performance.now() - playback.tickNext * playback.stepMs;
          playback.soundNext = playback.tickNext;
        }

        // ปุ่ม ฟังของฉัน / หยุด
        function toggleMine() {
          initAudio();
          if (playback && playback.source === 'mine') {
            stopPlayback('stop');
            return;
          }
          if (game && game.mode === 'free') notePlayed();
          startPlayback('mine', function () {
            return grid;
          }, 0, null);
        }

        // เล่นจังหวะที่สร้างเองครั้งแรกหลังแก้: นับสถิติและตรวจเหรียญนักแต่งจังหวะ
        function notePlayed() {
          var used = Core.usedTracks(grid);
          if (!freeDirty || !used.length) return;
          freeDirty = false;
          stats.freePlays += 1;
          saveStats();
          awardBadges({ mode: 'free', tracksUsed: used.length });
        }

        // วาดบรรทัดวิธีนับของทุกแถวที่มีเสียง ใส่ลงในกล่องที่ระบุ
        function fillCountingLines(box, rows, emptyText) {
          box.textContent = '';
          var any = false;
          Object.keys(rows).forEach(function (id) {
            var track = trackById(id);
            var text = Core.countingText(rows[id], CONFIG.stepsPerBeat, COUNT_SYLLABLES);
            if (!track || !text) return;
            any = true;
            box.appendChild(el('p', { class: 'row-line', text: track.label + ': ' + text }));
          });
          if (!any && emptyText) box.appendChild(el('p', { class: 'soft', text: emptyText }));
        }

        // วาดแถบวิธีนับของโหมดสร้างเอง ตามตารางตอนนี้
        function renderStrip() {
          fillCountingLines(byId('stripLines'), grid.rows, TEXT.countingEmpty);
        }

        // เปิดหน้าเล่นสำหรับโหมดที่เลือก (ยังไม่เริ่มข้อใด)
        function openPlay(mode, level) {
          stopPlayback('stop');
          game = {
            mode: mode,
            levelId: level.id,
            level: level,
            score: 0,
            streak: 0,
            index: 0,
            failed: 0,
            revealed: false,
            solved: false,
            results: [],
            rounds: [],
            groove: null,
            target: null
          };
          locked = false;
          marks = {};
          var free = mode === 'free';
          byId('playTitle').textContent = MODES.filter(function (item) {
            return item.id === mode;
          })[0].label;
          byId('hud').hidden = free;
          byId('freeControls').hidden = !free;
          byId('countingStrip').hidden = !free;
          byId('countingCard').hidden = mode !== 'read';
          byId('grooveCard').hidden = true;
          byId('playTarget').hidden = mode !== 'copy';
          byId('checkBtn').hidden = free;
          byId('revealBtn').hidden = free;
          byId('nextBtn').hidden = true;
          byId('tempo').hidden = !free;
          byId('roundCheck').textContent = '';
          byId('roundCheck').className = 'round-check';
          byId('tempo').min = CONFIG.bpmMin;
          byId('tempo').max = CONFIG.bpmMax;
          byId('tempo').step = CONFIG.bpmStep;
          showScreen('play');
        }

        // โหมดสร้างเอง: โหลดจังหวะที่เก็บไว้ ถ้าไม่มีหรือเสียหายใช้ตารางว่าง
        function startFree(groove) {
          openPlay('free', currentLevel());
          trackIds = allTrackIds();
          var saved = read(STORE.pattern, null);
          var restored = Core.gridFromSaved(saved, trackIds, CONFIG.stepsPerBeat);
          grid = restored || Core.emptyGrid(trackIds, 4, CONFIG.stepsPerBeat);
          bpm = restored && saved && isFinite(Number(saved.bpm)) ? clampBpm(saved.bpm) : CONFIG.bpmDefault;
          freeDirty = false;
          presetId = '';
          buildGrid();
          renderMetres();
          renderPresets();
          renderStrip();
          updateTransport();
          emit('gameStart', { mode: 'free', level: game.levelId, rounds: 0 });
          if (groove) loadGroove(groove);
        }

        // โหลดจังหวะตัวอย่างลงตาราง (พร้อมความเร็วของมัน) ในโหมดสร้างเอง
        function loadGroove(groove) {
          stopPlayback('stop');
          grid = Core.gridFromGroove(groove, trackIds, CONFIG.stepsPerBeat);
          bpm = clampBpm(groove.bpm);
          freeDirty = false;
          presetId = groove.id;
          marks = {};
          buildGrid();
          renderMetres();
          renderStrip();
          byId('presets').value = groove.id;
          byId('presetAbout').textContent = groove.about;
          updateTransport();
          saveFreePattern();
        }

        // วาดปุ่มสลับ 4/4 และ 3/4
        function renderMetres() {
          var box = byId('metres');
          box.textContent = '';
          [[4, 'metre44'], [3, 'metre34']].forEach(function (pair) {
            var pressed = grid.beats === pair[0] ? 'true' : 'false';
            var button = el('button', { type: 'button', 'aria-pressed': pressed, text: TEXT[pair[1]] });
            button.addEventListener('click', function () {
              if (grid.beats === pair[0]) return;
              stopPlayback('stop');
              grid = Core.resize(grid, pair[0], CONFIG.stepsPerBeat);
              marks = {};
              freeDirty = true;
              buildGrid();
              renderMetres();
              renderStrip();
              saveFreePattern();
            });
            box.appendChild(button);
          });
        }

        // วาดรายการจังหวะตัวอย่างทุกอันเป็นตัวเลือก
        function renderPresets() {
          var select = byId('presets');
          select.textContent = '';
          select.appendChild(el('option', { value: '', text: TEXT.presetLabel }));
          validGrooves().forEach(function (groove) {
            select.appendChild(el('option', { value: groove.id, text: groove.name }));
          });
          select.value = presetId;
          byId('presetAbout').textContent = '';
        }

        // โจทย์ของข้อปัจจุบัน
        function startRound() {
          var groove = game.rounds[game.index];
          game.groove = groove;
          trackIds = allTrackIds().filter(function (id) {
            return typeof groove.rows[id] === 'string';
          });
          grid = Core.emptyGrid(trackIds, groove.beats, CONFIG.stepsPerBeat);
          game.target = Core.gridFromGroove(groove, trackIds, CONFIG.stepsPerBeat);
          bpm = clampBpm(groove.bpm);
          game.failed = 0;
          game.revealed = false;
          game.solved = false;
          locked = false;
          marks = {};
          stopPlayback('stop');
          byId('grooveCard').hidden = true;
          byId('nextBtn').hidden = true;
          byId('checkBtn').disabled = false;
          byId('revealBtn').disabled = false;
          byId('roundCheck').textContent = '';
          byId('roundCheck').className = 'round-check';
          if (game.mode === 'read') {
            var rows = {};
            trackIds.forEach(function (id) {
              rows[id] = game.target.rows[id];
            });
            fillCountingLines(byId('countingLines'), rows, '');
          }
          buildGrid();
          updateTransport();
          renderHud();
          emit('roundStart', { index: game.index, grooveId: groove.id, mode: game.mode });
        }

        // ปรับตัวเลขบนแถบแสดงผลระหว่างเล่น
        function renderHud() {
          if (!game || game.mode === 'free') return;
          byId('hudScore').textContent = String(game.score);
          byId('hudStreak').textContent = game.streak >= 1 ? t('hudStreak', { n: game.streak }) : '';
          byId('hudRound').textContent = t('roundLabel', { i: game.index + 1, n: game.rounds.length });
        }

        // เริ่มเกมโหมดโจทย์: เลือกจังหวะตามระดับแล้วเริ่มข้อแรก
        function newGame(mode, levelId) {
          initAudio();
          var level = LEVELS.filter(function (item) {
            return item.id === levelId;
          })[0] || LEVELS[0];
          openPlay(mode, level);
          var rng = Core.makeRng(CONFIG.seed || Date.now());
          game.rounds = Core.pickRounds(validGrooves(), level, CONFIG.roundsPerGame, rng);
          if (!game.rounds.length) {
            returnHome();
            return;
          }
          emit('gameStart', { mode: mode, level: level.id, rounds: game.rounds.length });
          startRound();
        }

        // เสียงดีใจสั้น ๆ เมื่อเรียงถูก
        function successSound() {
          [523, 659, 784].forEach(function (hz, index) {
            playTone(hz, 0.16, index * 0.09);
          });
        }

        // ปุ่มตรวจ: เทียบตารางของผู้เล่นกับโจทย์
        function checkRound() {
          if (!game || locked || game.mode === 'free') return;
          initAudio();
          stopPlayback('stop');
          var result = Core.compare(grid, game.target);
          clearMarks();
          var line = byId('roundCheck');
          if (result.perfect) {
            var streakNow = game.failed === 0 ? game.streak + 1 : game.streak;
            emit('roundCheck', { perfect: true, missing: 0, extra: 0, failedChecks: game.failed });
            var points = Core.roundScore(game.failed, false, streakNow, CONFIG);
            game.streak = game.failed === 0 ? game.streak + 1 : 0;
            game.score += points;
            line.textContent = TEXT.checkPerfect;
            line.className = 'round-check is-pass';
            successSound();
            emit('scoreChange', { score: game.score, delta: points, streak: game.streak });
            popScore(byId('hudScoreBox'), points);
            finishRound(points, false);
            return;
          }
          game.failed += 1;
          result.missing.forEach(function (item) {
            marks[item.trackId + ':' + item.step] = 'missing';
          });
          result.extra.forEach(function (item) {
            marks[item.trackId + ':' + item.step] = 'extra';
          });
          renderCells();
          line.textContent = t('checkResult', { extra: result.extra.length, missing: result.missing.length });
          line.className = 'round-check is-fail';
          emit('roundCheck', {
            perfect: false,
            missing: result.missing.length,
            extra: result.extra.length,
            failedChecks: game.failed
          });
          playTone(147, 0.2, 0, 'square');
        }

        // ดูเฉลย: ใส่คำตอบลงตาราง ข้อนี้ได้ 0 คะแนน
        function revealRound() {
          if (!game || locked || game.mode === 'free') return;
          stopPlayback('stop');
          clearMarks();
          grid = Core.copyGrid(game.target);
          game.revealed = true;
          game.streak = 0;
          renderCells();
          finishRound(0, true);
        }

        // ข้อนี้จบแล้ว (ผ่านหรือดูเฉลย): ล็อกตาราง แสดงการ์ดจังหวะ เล่นจังหวะนั้นหนึ่งรอบ และรอผู้เล่นกดต่อไป
        function finishRound(points, revealed) {
          locked = true;
          game.solved = true;
          game.results.push({
            grooveId: game.groove.id,
            failedChecks: game.failed,
            revealed: revealed,
            points: points
          });
          emit('roundEnd', { grooveId: game.groove.id, points: points, failedChecks: game.failed, revealed: revealed });
          byId('countingCard').hidden = true;
          byId('checkBtn').disabled = true;
          byId('revealBtn').disabled = true;
          byId('grooveName').textContent = t('grooveCardTitle', { name: game.groove.name });
          byId('grooveAbout').textContent = game.groove.about;
          byId('grooveBeats').textContent = t('grooveBeatsLine', { beats: game.groove.beats, bpm: game.groove.bpm });
          var full = Core.gridFromGroove(game.groove, allTrackIds(), CONFIG.stepsPerBeat);
          fillCountingLines(byId('grooveLines'), full.rows, '');
          byId('grooveCard').hidden = false;
          byId('nextBtn').hidden = false;
          byId('nextBtn').focus();
          renderHud();
          if (audio) {
            var played = game.target;
            startPlayback('target', function () {
              return played;
            }, 1, null);
          }
        }

        // ปุ่มต่อไป: ข้อถัดไป หรือจบเกมถ้าเป็นข้อสุดท้าย
        function nextRound() {
          if (!game || !game.solved) return;
          if (game.index + 1 >= game.rounds.length) {
            endGame();
            return;
          }
          game.index += 1;
          startRound();
        }

        // จบเกมโหมดโจทย์: คำนวณผล บันทึกสถิติ ให้เหรียญ แจ้งเหตุการณ์ และแสดงหน้าสรุป
        function endGame() {
          stopPlayback('stop');
          var rounds = game.results.map(function (item) {
            return { grooveId: item.grooveId, failedChecks: item.failedChecks, revealed: item.revealed };
          });
          var result = {
            mode: game.mode,
            level: game.levelId,
            score: game.score,
            stars: Core.stars(rounds),
            rounds: rounds
          };
          game.results.forEach(function (item) {
            if (!item.revealed && stats.solved.indexOf(item.grooveId) === -1) stats.solved.push(item.grooveId);
          });
          var bestKey = game.mode + ':' + game.levelId;
          var newBest = Core.isBetter(result, stats.best[bestKey]);
          if (newBest) stats.best[bestKey] = { score: result.score, stars: result.stars };
          saveStats();
          awardBadges(result);
          lastResult = { result: result, newBest: newBest, game: game };
          emit('gameEnd', result);
          renderResult();
          showScreen('result');
        }

        // ดาวเป็นข้อความ ไม่ใช้สีหรือรูปอย่างเดียว
        function starsText(count) {
          return count >= 3 ? TEXT.stars3 : count === 2 ? TEXT.stars2 : TEXT.stars1;
        }

        // วาดหน้าสรุปผลของเกมที่เพิ่งจบ
        function renderResult() {
          var info = lastResult;
          var result = info.result;
          byId('resultHeading').textContent = TEXT.resultCopy;
          var body = byId('resultBody');
          body.textContent = '';
          var scoreLine = el('p', { class: 'result-score', id: 'resultScore' });
          body.appendChild(scoreLine);
          function statLine(text) {
            body.appendChild(el('p', { class: 'stat-line', text: text }));
          }
          var firstTries = result.rounds.filter(function (round) {
            return round.failedChecks === 0 && !round.revealed;
          }).length;
          var checks = result.rounds.reduce(function (sum, round) {
            return sum + round.failedChecks + (round.revealed ? 0 : 1);
          }, 0);
          var revealed = result.rounds.filter(function (round) {
            return round.revealed;
          }).length;
          statLine(t('statStars', { stars: starsText(result.stars) }));
          statLine(t('statFirstTry', { n: firstTries }));
          statLine(t('statChecks', { n: checks }));
          statLine(t('statRevealed', { n: revealed }));
          if (info.newBest) body.appendChild(el('p', { class: 'new-best', text: TEXT.newBest }));
          body.appendChild(el('h2', { text: TEXT.grooveListTitle }));
          var list = el('ul', { class: 'result-groove-list' });
          result.rounds.forEach(function (round) {
            var groove = GROOVES.filter(function (item) {
              return item.id === round.grooveId;
            })[0];
            var status = round.revealed
              ? TEXT.rowRevealed
              : round.failedChecks === 0
                ? TEXT.rowFirstTry
                : t('rowAfterChecks', { n: round.failedChecks });
            var kids = [el('span', { text: groove.name + ' · ' + status })];
            if (round.revealed || round.failedChecks > 0) {
              var retry = el('button', { type: 'button', text: TEXT.btnRetryFree });
              retry.addEventListener('click', function () {
                startFree(groove);
              });
              kids.push(retry);
            }
            list.appendChild(el('li', {}, kids));
          });
          body.appendChild(list);
          countUp(scoreLine, result.score);
          revealRows(body);
        }

        // สร้างข้อความสถิติที่ดีที่สุดของโหมดและระดับที่เลือกบนหน้าแรก
        function bestText() {
          if (settings.mode === 'free') return '';
          var best = stats.best[settings.mode + ':' + settings.level];
          if (!best || typeof best !== 'object') return TEXT.bestNone;
          return t('bestLine', { value: best.score });
        }

        // วาดหน้าแรก: โหมด ระดับ สถิติ และเหรียญ
        function renderHome() {
          validateChoices();
          var audioOk = audioAvailable();
          var modes = byId('modes');
          modes.textContent = '';
          MODES.forEach(function (mode) {
            var blocked = mode.needsSound && !audioOk;
            var pressed = mode.id === settings.mode ? 'true' : 'false';
            var button = el('button', { type: 'button', 'aria-pressed': pressed }, [
              el('strong', { text: mode.label }),
              el('small', { text: mode.about })
            ]);
            if (blocked) button.setAttribute('aria-disabled', 'true');
            button.addEventListener('click', function () {
              if (blocked) {
                byId('earNotice').textContent = TEXT.audioNeeded;
                return;
              }
              byId('earNotice').textContent = '';
              settings.mode = mode.id;
              saveSettings();
              renderHome();
            });
            modes.appendChild(button);
          });
          var levels = byId('levels');
          levels.textContent = '';
          LEVELS.forEach(function (level) {
            var pressed = level.id === settings.level ? 'true' : 'false';
            var button = el('button', { type: 'button', 'aria-pressed': pressed, text: level.label });
            button.addEventListener('click', function () {
              settings.level = level.id;
              saveSettings();
              renderHome();
            });
            levels.appendChild(button);
          });
          byId('levelBlock').hidden = settings.mode === 'free';
          byId('homeBest').textContent = bestText();
          byId('solvedLine').textContent = t('solvedLine', {
            n: stats.solved.filter(function (id) {
              return validGrooves().some(function (groove) {
                return groove.id === id;
              });
            }).length,
            m: validGrooves().length
          });
          renderMedals();
        }

        // กลับหน้าแรก และหยุดทุกอย่างที่ค้างอยู่
        function returnHome() {
          stopPlayback('stop');
          game = null;
          renderHome();
          showScreen('home');
        }

        // ไปหน้าที่ระบุ (ใช้ได้เฉพาะหน้าที่เปิดได้ในขณะนั้น) คืนค่าจริงถ้าสำเร็จ
        function goTo(name) {
          if (name === 'home') {
            returnHome();
            return true;
          }
          if (name === 'howto' || name === 'badges') {
            showScreen(name);
            return true;
          }
          if ((name === 'play' && game) || (name === 'result' && lastResult)) {
            showScreen(name);
            return true;
          }
          return false;
        }

        // ล้างข้อมูลเสร็จแล้ว ให้หน้าจอกลับไปเป็นค่าเริ่มต้น
        function resetAfterClear() {
          byId('volume').value = settings.volume;
          byId('theme').value = settings.theme;
          byId('reduce').checked = settings.reduceMotion;
          lastResult = null;
          renderHome();
        }

        // สำเนาตารางตอนนี้
        function getGrid() {
          return grid ? Core.copyGrid(grid) : null;
        }

        // ใส่ตารางใหม่ (โหมดสร้างเองเท่านั้น) คืนค่าจริงถ้าใส่ได้ ตารางที่รูปแบบผิดจะถูกปฏิเสธ
        function setGrid(next) {
          if (!game || game.mode !== 'free' || locked) return false;
          var shapeOk = next && (next.beats === 3 || next.beats === 4) && next.rows && typeof next.rows === 'object';
          if (!shapeOk) return false;
          var length = next.beats * CONFIG.stepsPerBeat;
          var fresh = Core.emptyGrid(trackIds, next.beats, CONFIG.stepsPerBeat);
          trackIds.forEach(function (id) {
            var row = next.rows[id];
            if (!Array.isArray(row)) return;
            for (var step = 0; step < length; step++) fresh.rows[id][step] = row[step] === true;
          });
          var changedBeats = next.beats !== grid.beats;
          if (changedBeats) stopPlayback('stop');
          grid = fresh;
          marks = {};
          freeDirty = true;
          if (changedBeats) {
            buildGrid();
            renderMetres();
          } else {
            renderCells();
          }
          renderStrip();
          saveFreePattern();
          return true;
        }

        // ตั้งความเร็ว (โหมดสร้างเองเท่านั้น) ไม่เกินช่วงของแถบเลื่อน คืนค่าจริงถ้าตั้งได้
        function setBpm(value) {
          if (!game || game.mode !== 'free') return false;
          bpm = clampBpm(value);
          retime();
          updateTransport();
          saveFreePattern();
          return true;
        }

        // สำเนาสถานะปัจจุบันของเกม (อ่านอย่างเดียว)
        function getState() {
          var view = { screen: activeScreen, playing: Boolean(playback), bpm: bpm };
          if (game) {
            view.mode = game.mode;
            view.level = game.levelId;
            view.score = game.score;
            view.streak = game.streak;
            view.index = game.index;
            view.rounds = game.rounds.length;
            view.failedChecks = game.failed;
            view.solved = game.solved;
            view.beats = grid ? grid.beats : null;
            view.grooveId = game.groove ? game.groove.id : null;
          }
          return view;
        }

        // ผูกปุ่มทั้งหมดของเกม
        function bindControls() {
          bindSharedControls();
          byId('grid').addEventListener('keydown', onGridKey);
          byId('startPlay').addEventListener('click', function () {
            initAudio();
            var mode = MODES.filter(function (item) {
              return item.id === settings.mode;
            })[0];
            if (mode.needsSound && !audio) {
              byId('earNotice').textContent = TEXT.audioNeeded;
              return;
            }
            byId('earNotice').textContent = '';
            if (mode.id === 'free') startFree(null);
            else newGame(mode.id, settings.level);
          });
          byId('playMine').addEventListener('click', toggleMine);
          byId('metronomeVolume').addEventListener('input', function () {
            metronomeVolume = Number(this.value);
            byId('metronomeVolumeText').textContent = '🔊 เสียง Metronome ' + metronomeVolume + '%';
          });
          byId('metronomeToggle').addEventListener('click', function () {
            initAudio();
            metronomeEnabled = !metronomeEnabled;
            this.textContent = metronomeEnabled ? '🔔 Metronome: ON' : '🔕 Metronome: OFF';
            this.setAttribute('aria-pressed', String(metronomeEnabled));
            // Give an immediate audible confirmation, even before playback starts.
            if (metronomeEnabled && audio) {
              if (audio.state === 'suspended' && audio.resume) {
                audio.resume().then(function () { playMetronomeClick(0, true, true); }).catch(function () {});
              } else {
                playMetronomeClick(0, true, true);
              }
            }
          });
          byId('playTarget').addEventListener('click', function () {
            initAudio();
            if (!game || !game.target) return;
            var target = game.target;
            startPlayback('target', function () {
              return target;
            }, CONFIG.targetLoops, null);
          });
          byId('checkBtn').addEventListener('click', checkRound);
          twoStep(byId('revealBtn'), 'btnReveal', 'btnRevealConfirm', revealRound);
          byId('nextBtn').addEventListener('click', nextRound);
          twoStep(byId('quitBtn'), 'btnQuit', 'btnQuitConfirm', returnHome, function () {
            return !game || game.mode === 'free' || game.solved;
          });
          twoStep(byId('clearBtn'), 'btnClear', 'btnClearConfirm', function () {
            if (!game || game.mode !== 'free') return;
            grid = Core.emptyGrid(trackIds, grid.beats, CONFIG.stepsPerBeat);
            marks = {};
            presetId = '';
            freeDirty = false;
            byId('presets').value = '';
            byId('presetAbout').textContent = '';
            renderCells();
            renderStrip();
            saveFreePattern();
          });
          byId('tempo').addEventListener('input', function () {
            if (game && game.mode === 'free') setBpm(this.value);
          });
          byId('presets').addEventListener('change', function () {
            var groove = GROOVES.filter(function (item) {
              return item.id === this.value;
            }, this)[0];
            if (groove) loadGroove(groove);
          });
          byId('againBtn').addEventListener('click', function () {
            if (lastResult) newGame(lastResult.result.mode, lastResult.result.level);
          });
          byId('homeBtn').addEventListener('click', returnHome);
          document.addEventListener('visibilitychange', function () {
            if (document.hidden) stopPlayback('stop');
          });
        }

        window.Game = {
          on: on,
          getState: getState,
          getStats: function () {
            return clone(stats);
          },
          CONFIG: CONFIG,
          DATA: DATA,
          Core: Core,
          runSelfCheck: runSelfCheck,
          playTone: playTone,
          showToast: showToast,
          goTo: goTo,
          playHit: function (trackId, whenSec) {
            initAudio();
            playHit(trackId, whenSec);
          },
          getGrid: getGrid,
          setGrid: setGrid,
          setBpm: setBpm,
          play: function () {
            if (!game || !grid || playback) return;
            toggleMine();
          },
          stop: function () {
            stopPlayback('stop');
          },
          isPlaying: function () {
            return Boolean(playback);
          }
        };

        // เริ่มทำงานเมื่อโหลดหน้า
        loadAll();
        applyOptions();
        applyText();
        bindControls();
        renderHowto();
        renderHome();
        showStorageNotice();
        if (new URLSearchParams(location.search).get('selfcheck') === '1') {
          byId('settings').open = true;
          showCheck();
        } else if (!stats.seenHowto) {
          showScreen('howto');
        }
        /* ═══════════ โซน E · ส่วนเสริมของนิสิต (เขียนเพิ่มที่นี่) ═══════════ */
        /* วิธีใช้โซนนี้: เขียนส่วนเสริมของคุณที่นี่ โดยฟังเหตุการณ์ด้วย Game.on(ชื่อเหตุการณ์, ฟังก์ชัน)
           และเรียกตัวช่วยของ Game เช่น Game.getGrid, Game.setGrid, Game.setBpm, Game.showToast
           วางปุ่มหรือข้อความของคุณในช่องว่าง slotHome, slotHud, slotActions, slotPanel, slotResult ได้เลย
           ห้ามแก้โซน C ถ้าส่วนเสริมพัง เกมจะเล่นต่อได้ และข้อความผิดพลาดจะไปแสดงที่ปุ่ม "ตรวจระบบ" */
        /* เพิ่มส่วนเสริมที่นี่ */
        /* ตัวอย่าง (ลบเครื่องหมายคอมเมนต์ออกเพื่อใช้): แสดงข้อความทุกครั้งที่เริ่มต้นจังหวะใหม่ของห้อง
        Game.on('stepTick', function (detail) {
          if (detail.isBeatStart && detail.beat === 1) Game.showToast('เริ่มห้องใหม่');
        });
        */
      }());
    </script>
  </body>
</html>
