<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>กล่องจังหวะ</title>

    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#dfe9ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1a21" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="กล่องจังหวะ" />
    <meta
      property="og:description"
      content="สร้างจังหวะกลองบนตาราง ฟังแล้วเรียงตาม และฝึกนับจังหวะย่อย"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="th_TH" />
    <style>
      /* สีหลัก */
      :root {
        --bg: #dfe9ef; /* พื้นหลังของหน้า */
        --surface: #ffffff; /* พื้นการ์ด */
        --surface-2: #f3f8fa; /* พื้นช่องใส่ข้อมูลและปุ่มรอง */
        --line: #c6d6e0; /* เส้นขอบ */
        --line-strong: #b5c8d4; /* เส้นหนัก เช่น เส้นบรรทัดห้าเส้น */
        --text: #17252f; /* ตัวอักษรหลัก */
        --text-soft: #33454f; /* ตัวอักษรรอง */
        --muted: #5f7584; /* คำอธิบายเล็ก (ใช้บนพื้นการ์ดเท่านั้น) */
        --action: #c4421f; /* ปุ่มหลักและจุดเน้น */
        --action-ink: #ffffff; /* ตัวอักษรบนปุ่มหลัก */
        --action-soft: #fdece7; /* พื้นเน้นอ่อน */
        --blue: #3f6f8d; /* สีรอง และวงโฟกัส */
        --blue-soft: #e3eef5; /* พื้นข้อมูลอ่อน */
        --brass: #9a6a1f; /* สีที่สาม ใช้กับเหรียญ */
        --good: #2e7d59; /* ถูก */
        --good-soft: #e1f2ea; /* พื้นเมื่อถูก */
        --warn: #9a6a1f; /* ใกล้ถูก หรือควรระวัง */
        --bad: #b3261e; /* ผิด */
        --bad-soft: #fbe6e4; /* พื้นเมื่อผิด */
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0f1a21;
          --surface: #172630;
          --surface-2: #1c2f3b;
          --line: #2c4150;
          --line-strong: #3a5263;
          --text: #e6eef3;
          --text-soft: #c3d3dc;
          --muted: #8ea3b1;
          --action: #f07a5a;
          --action-ink: #1b0e09;
          --action-soft: #3a221b;
          --blue: #8cb8d3;
          --blue-soft: #1d3442;
          --brass: #d9a94f;
          --good: #7fd1a6;
          --good-soft: #1b3a2e;
          --warn: #e3b04b;
          --bad: #ff8a80;
          --bad-soft: #4a2220;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0f1a21;
        --surface: #172630;
        --surface-2: #1c2f3b;
        --line: #2c4150;
        --line-strong: #3a5263;
        --text: #e6eef3;
        --text-soft: #c3d3dc;
        --muted: #8ea3b1;
        --action: #f07a5a;
        --action-ink: #1b0e09;
        --action-soft: #3a221b;
        --blue: #8cb8d3;
        --blue-soft: #1d3442;
        --brass: #d9a94f;
        --good: #7fd1a6;
        --good-soft: #1b3a2e;
        --warn: #e3b04b;
        --bad: #ff8a80;
        --bad-soft: #4a2220;
        color-scheme: dark;
      }
      /* ขนาดและระยะ */
      :root {
        --space-1: 4px; /* ระยะห่างเล็กที่สุด */
        --space-2: 8px; /* ระยะห่างเล็ก */
        --space-3: 12px; /* ระยะห่างกลาง */
        --space-4: 16px; /* ระยะห่างมาตรฐานและขอบหน้า */
        --space-5: 24px; /* ระยะห่างใหญ่ */
        --space-6: 32px; /* ระยะห่างใหญ่มาก */
        --radius-control: 12px; /* มุมปุ่มและช่องกรอก */
        --radius-card: 18px; /* มุมการ์ด */
        --radius-pill: 999px; /* มุมแบบแคปซูล */
        --page-width: 592px; /* ความกว้างสูงสุดของหน้า รวมขอบ */
        --target-min: 44px; /* ขนาดต่ำสุดของปุ่มที่ต้องแตะ */
        --button-main: 52px; /* ความสูงปุ่มหลัก */
        --text-small: 14.4px; /* ตัวอักษรเล็ก */
        --text-base: 16px; /* ตัวอักษรปกติ */
        --text-medium: 18px; /* ตัวอักษรหัวข้อย่อย */
        --text-large: 22px; /* ตัวอักษรตัวเลข */
        --text-title: 28px; /* ตัวอักษรหัวเรื่อง */
        --medal-size: 32px; /* ขนาดเหรียญ */
        --pop-distance: 12px; /* ระยะที่คะแนนลอยขึ้น */
        --pop-duration: 200ms; /* เวลาที่คะแนนลอย */
        --fade-duration: 200ms; /* เวลาเปลี่ยนสถานะของปุ่มและช่อง */
        --result-step: 80ms; /* ระยะหน่วงของแต่ละบรรทัดในหน้าสรุป */
        --font-main: 'Sarabun', 'Leelawadee UI', 'Noto Sans Thai', Thonburi, Tahoma, system-ui, sans-serif;
        --font-mono: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: var(--text-base) / 1.6 var(--font-main);
      }
      main {
        max-width: var(--page-width);
        margin: 0 auto;
        padding: var(--space-5) var(--space-4);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: var(--text-title);
        line-height: 1.4;
        text-wrap: balance;
      }
      h2 {
        font-size: var(--text-medium);
        margin: var(--space-4) 0 var(--space-2);
        text-wrap: balance;
      }
      h3 {
        font-size: var(--text-base);
        margin: var(--space-3) 0 var(--space-1);
      }
      h1:focus {
        outline: none;
      }
      button,
      select {
        font: inherit;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        min-height: var(--target-min);
        padding: var(--space-2) var(--space-3);
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible,
      input:focus-visible,
      [role='button']:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 2px;
      }
      button:disabled,
      button[aria-disabled='true'] {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        background: var(--action);
        color: var(--action-ink);
        border-color: var(--action);
        min-height: var(--button-main);
        font-weight: 700;
      }
      button:active:not(:disabled) {
        transform: scale(0.98);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin: var(--space-4) 0;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: var(--space-4);
        margin-top: var(--space-4);
      }
      .soft {
        color: var(--text-soft);
      }
      .small {
        font-size: var(--text-small);
      }
      .segments {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }
      .segments button[aria-pressed='true'] {
        background: var(--surface);
        border-color: var(--blue);
        outline: 1px solid var(--blue);
        font-weight: 700;
      }
      .choice-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-3);
      }
      .choice-grid button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: start;
        min-width: 0;
        background: var(--surface);
      }
      .choice-grid button small {
        color: var(--text-soft);
        font-size: var(--text-small);
        line-height: 1.5;
      }
      .choice-grid button[aria-pressed='true'] {
        border-color: var(--action);
        outline: 2px solid var(--action);
        background: var(--action-soft);
      }
      .hud {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2) var(--space-5);
        align-items: flex-end;
        margin-bottom: var(--space-3);
      }
      .hud strong {
        display: block;
        font-size: var(--text-large);
        line-height: 1.15;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .hud-item {
        position: relative;
        min-width: 0;
      }
      .score-pop {
        position: absolute;
        left: 0;
        top: -4px;
        color: var(--good);
        font-weight: 700;
        pointer-events: none;
        animation: score-pop var(--pop-duration) ease-out forwards;
      }
      @keyframes score-pop {
        from {
          transform: translateY(var(--pop-distance));
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .medals {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
      }
      .medals svg,
      .badge-list svg {
        width: var(--medal-size);
        height: var(--medal-size);
        color: var(--brass);
        flex: none;
      }
      .medal-earned circle {
        fill: var(--action-soft);
      }
      .badge-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .badge-list li {
        display: flex;
        gap: var(--space-3);
        align-items: center;
        margin-bottom: var(--space-3);
      }
      .steps {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .steps li {
        display: flex;
        gap: var(--space-3);
        align-items: center;
        margin-bottom: var(--space-3);
      }
      .steps svg {
        width: 56px;
        height: 56px;
        flex: none;
        color: var(--blue);
      }
      .toast {
        position: fixed;
        left: var(--space-4);
        right: var(--space-4);
        bottom: var(--space-4);
        max-width: 360px;
        margin: 0 auto;
        padding: var(--space-3);
        background: var(--blue-soft);
        border: 1px solid var(--blue);
        border-radius: var(--radius-control);
        color: var(--text);
        text-align: center;
        z-index: 10;
      }
      .notice {
        color: var(--text-soft);
        margin-bottom: var(--space-2);
      }
      .notice:empty,
      [data-slot]:empty {
        display: none;
      }
      .settings {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: var(--space-4);
        margin-top: var(--space-5);
      }
      .settings summary {
        font-weight: 700;
        cursor: pointer;
        min-height: var(--target-min);
        display: flex;
        align-items: center;
      }
      .settings label {
        display: block;
        margin-top: var(--space-3);
      }
      .settings input[type='range'] {
        width: 100%;
        accent-color: var(--action);
      }
      .check-result {
        margin-top: var(--space-3);
        padding: var(--space-3);
        background: var(--surface-2);
        border-radius: var(--radius-control);
      }
      .check-result ul {
        padding-inline-start: var(--space-5);
        margin: var(--space-2) 0;
      }
      .check-result .is-pass {
        color: var(--good);
        font-weight: 700;
      }
      .check-result .is-fail {
        color: var(--bad);
        font-weight: 700;
      }
      .result-score {
        font-size: 40px;
        font-weight: 700;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      .result-rows > * {
        opacity: 0;
        transition: opacity var(--fade-duration);
        transition-delay: calc(var(--result-step) * var(--row, 0));
      }
      .result-rows.is-revealed > *,
      :root[data-reduce='true'] .result-rows > * {
        opacity: 1;
      }
      .stat-line {
        margin: var(--space-1) 0;
      }
      .new-best {
        color: var(--good);
        font-weight: 700;
      }
      footer {
        margin-top: var(--space-5);
        color: var(--text-soft);
        font-size: var(--text-small);
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      progress {
        width: 100%;
        accent-color: var(--action);
      }
      :root[data-reduce='true'] *,
      :root[data-reduce='true'] *::after {
        animation: none !important;
        transition: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .result-rows > * {
          opacity: 1;
        }
      }
      /* สีของเกม */
      :root {
        --track-hat: #b45309; /* สีของแถวไฮแฮต */
        --track-snare: #2563a8; /* สีของแถวสแนร์ */
        --track-wood: #2e7d59; /* สีของแถวเคาะไม้ */
        --track-kick: #c4421f; /* สีของแถวกลองใหญ่ */
        --track-ink: #ffffff; /* สีจุดและตัวอักษรบนช่องที่มีเสียง */
        --cell-empty: var(--surface-2); /* พื้นช่องว่าง */
        --cell-line: var(--line-strong); /* เส้นขอบช่อง */
        --playhead: var(--blue); /* สีกรอบของช่องที่กำลังเล่น */
        --beat-line: var(--text-soft); /* เส้นคั่นต้นจังหวะ */
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --track-hat: #e3b04b;
          --track-snare: #8cb8d3;
          --track-wood: #7fd1a6;
          --track-kick: #f07a5a;
          --track-ink: #0f1a21;
        }
      }
      :root[data-theme='dark'] {
        --track-hat: #e3b04b;
        --track-snare: #8cb8d3;
        --track-wood: #7fd1a6;
        --track-kick: #f07a5a;
        --track-ink: #0f1a21;
      }
      /* ขนาดและระยะ */
      :root {
        --cell-min: 44px; /* ความสูงและกว้างต่ำสุดของช่อง */
        --label-col: 40px; /* ความกว้างคอลัมน์ป้ายช่อง (จอแคบ) */
        --head-col: 96px; /* ความกว้างคอลัมน์ชื่อแถวเสียง (จอกว้าง) */
        --beat-gap: 8px; /* ช่องว่างก่อนต้นจังหวะ */
        --grid-gap: 4px; /* ระยะห่างระหว่างช่อง */
        --transport-gap: 8px; /* ระยะห่างของปุ่มในแถบควบคุมด้านล่าง */
      }
      .grid-wrap {
        margin-top: var(--space-3);
      }
      .grid {
        display: grid;
        gap: var(--grid-gap);
        grid-template-columns: var(--label-col) repeat(var(--tracks), minmax(0, 1fr));
        grid-auto-rows: minmax(var(--cell-min), auto);
        position: relative;
      }
      .grid-corner {
        grid-row: 1;
        grid-column: 1;
      }
      .track-head {
        grid-row: 1;
        grid-column: calc(var(--t) + 2);
        position: sticky;
        top: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: var(--bg);
        border-bottom: 4px solid var(--track-color);
        font-size: var(--text-small);
        font-weight: 700;
        line-height: 1.3;
        padding: var(--space-1);
        min-height: var(--cell-min);
      }
      .step-label {
        grid-row: calc(var(--s) + 2);
        grid-column: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-soft);
        font-size: var(--text-small);
      }
      .step-label.is-beat {
        font-weight: 700;
        color: var(--text);
        font-size: var(--text-base);
      }
      .step-label.is-now {
        background: var(--blue-soft);
        border-radius: 8px;
      }
      .cell {
        grid-row: calc(var(--s) + 2);
        grid-column: calc(var(--t) + 2);
        min-height: var(--cell-min);
        min-width: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--cell-empty);
        border: 1px solid var(--cell-line);
        border-radius: 8px;
        font-size: var(--text-small);
        font-weight: 700;
        line-height: 1;
      }
      .step-label.is-beat,
      .cell.is-beat {
        margin-block-start: var(--beat-gap);
      }
      .cell-mark {
        pointer-events: none;
      }
      .cell.is-on {
        background: var(--track-color);
        border-color: var(--track-color);
        color: var(--track-ink);
      }
      .cell.is-now {
        outline: 3px solid var(--playhead);
        outline-offset: -2px;
      }
      .cell.is-on.is-hit {
        box-shadow: inset 0 0 0 4px var(--surface);
      }
      .cell.is-extra {
        border: 3px dashed var(--bad);
      }
      .cell.is-missing {
        border: 3px dotted var(--good);
        background: var(--good-soft);
        color: var(--text);
      }
      .round-check {
        margin-top: var(--space-2);
        font-weight: 700;
      }
      .round-check:not(:empty) {
        background: var(--surface);
        border-radius: var(--radius-control);
        border-inline-start: 6px solid var(--line-strong);
        padding: var(--space-2) var(--space-3);
      }
      .round-check.is-pass {
        color: var(--good);
        border-inline-start-color: var(--good);
      }
      .round-check.is-fail {
        color: var(--bad);
        border-inline-start-color: var(--bad);
      }
      .panel .row-line {
        margin: var(--space-1) 0;
      }
      .panel select {
        display: block;
        width: 100%;
        margin-top: var(--space-1);
      }
      .transport {
        position: sticky;
        bottom: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--transport-gap);
        margin: var(--space-4) calc(-1 * var(--space-4)) 0;
        padding: var(--space-3) var(--space-4);
        background: var(--surface);
        border-top: 1px solid var(--line);
      }
      .transport .tempo {
        display: flex;
        flex-direction: column;
        flex: 1 1 160px;

        list-style: none;
        padding: 0;
        margin: var(--space-2) 0;
      }
      .result-groove-list li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-2) var(--space-3);
        margin-bottom: var(--space-2);
      }
      @media (min-width: 720px) {
        :root {
          --page-width: 960px;
        }
        .grid {
          grid-template-columns: var(--head-col) repeat(var(--steps), minmax(0, 1fr));
        }
        .track-head {
          grid-row: calc(var(--t) + 2);
          grid-column: 1;
          position: static;
          border-bottom: 0;
          border-inline-end: 4px solid var(--track-color);
          justify-content: flex-start;
        }
        .step-label {
          grid-row: 1;
          grid-column: calc(var(--s) + 2);
        }
        .cell {
          grid-row: calc(var(--t) + 2);
          grid-column: calc(var(--s) + 2);
          min-width: var(--cell-min);
        }
        .step-label.is-beat,
        .cell.is-beat {
          margin-block-start: 0;
          margin-inline-start: var(--beat-gap);
        }
        .transport {
          margin-inline: 0;
          border: 1px solid var(--line);
          border-radius: var(--radius-card);
        }

          storageOk: 'บันทึกได้',
          storageBlocked: 'บันทึกไม่ได้',
        };
        /* ═══════════ โซน B · ตั้งค่า (แก้ได้) ═══════════ */
        /* ตัวเลขที่ปรับได้ของเกม ชื่อทุกตัวบอกหน่วยไว้ท้ายชื่อ (Ms = มิลลิวินาที, Bpm = จังหวะต่อนาที) */
        var CONFIG = {
          /* ค่ากลางที่ทุกเกมใช้ร่วมกัน */
          masterGain: 0.2, // ระดับเสียงรวมของเครื่องเสียง (ก่อนคูณระดับเสียงจากแถบเลื่อน)
          defaultVolumePercent: 25, // ระดับเสียงเริ่มต้น (0-100)
          audioAttackSec: 0.01, // เวลาไล่เสียงขึ้นของแต่ละตัว (วินาที)
          audioReleaseSec: 0.02, // เวลาไล่เสียงลงของแต่ละตัว (วินาที)
          toastMs: 2500, // เวลาที่ข้อความสั้น ๆ แสดงอยู่ (มิลลิวินาที)
          confirmMs: 3000, // เวลาที่ปุ่มยืนยันสองขั้นรออยู่ (มิลลิวินาที)
          popMs: 600, // เวลาก่อนลบตัวเลขคะแนนที่ลอยขึ้น (มิลลิวินาที)
          countUpMs: 600, // เวลานับคะแนนขึ้นในหน้าสรุป (มิลลิวินาที)
          seed: 0, // เมล็ดของตัวสุ่ม (0 = สุ่มใหม่ทุกครั้ง ใส่เลขอื่นเพื่อให้ได้โจทย์ชุดเดิมซ้ำ)
          stepsPerBeat: 4, // จำนวนช่องในหนึ่งจังหวะ
          bpmMin: 60, // ความเร็วต่ำสุดของแถบเลื่อน (จังหวะต่อนาที)
          bpmMax: 160, // ความเร็วสูงสุดของแถบเลื่อน (จังหวะต่อนาที)
          bpmStep: 2, // ขั้นของแถบเลื่อนความเร็ว (จังหวะต่อนาที)
          bpmDefault: 96, // ความเร็วของตารางว่างในโหมดสร้างเอง (จังหวะต่อนาที)
          lookaheadMs: 100, // ตั้งเสียงล่วงหน้ากี่มิลลิวินาที
          maxLateMs: 400, // ถ้าหน้าจอค้างเกินเวลานี้ ช่องที่เลยเวลาไปแล้วจะถูกข้าม (มิลลิวินาที)
          hitFlashMs: 120, // เวลาที่ช่องที่เพิ่งส่งเสียงกะพริบ (มิลลิวินาที)
          roundsPerGame: 4, // จำนวนจังหวะในหนึ่งเกมโหมดโจทย์
          roundPoints: 100, // คะแนนของข้อที่ตรวจผ่านในครั้งแรก
          checkPenaltyPoints: 25, // คะแนนที่หักต่อการตรวจที่ไม่ผ่านหนึ่งครั้ง
          minRoundPoints: 25, // คะแนนน้อยที่สุดของข้อที่ผ่าน
          firstTryBonusPoints: 50, // โบนัสต่อข้อที่ผ่านในการตรวจครั้งแรกติดกัน (คูณจำนวนข้อที่ติดกัน)
          maxStreakBonus: 3, // จำนวนข้อติดกันสูงสุดที่นับโบนัส
          targetLoops: 2 // จำนวนห้องที่ปุ่ม "ฟังโจทย์" เล่น
        };
        /* ═══════════ โซน C · แกนเกม (ห้ามแก้) ═══════════ */
        /* แกนเกม: ฟังก์ชันล้วน ไม่แตะหน้าจอ เสียง หรือที่เก็บข้อมูล ตัวสุ่มส่งเข้ามาจากข้างนอกเพื่อทดสอบซ้ำได้
           ตารางจังหวะ (grid) หน้าตาเป็น { beats, rows: { รหัสแถว: [true หรือ false ต่อช่อง] } } */
        var Core = {};

        // สร้างตัวสุ่มที่ให้ผลซ้ำได้เมื่อใช้เมล็ดเดียวกัน (mulberry32) คืนฟังก์ชันที่ให้เลข 0 ถึงน้อยกว่า 1
        Core.makeRng = function (seed) {
          var state = seed >>> 0;
          return function () {
            state = (state + 0x6d2b79f5) >>> 0;
            var x = state;
            x = Math.imul(x ^ (x >>> 15), x | 1);
            x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
            return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
          };
        };

        // สลับลำดับรายการโดยไม่แก้รายการเดิม
        Core.shuffle = function (list, rng) {
          var copy = list.slice();
          for (var i = copy.length - 1; i > 0; i--) {
            var j = Math.floor(rng() * (i + 1));
            var temp = copy[i];
            copy[i] = copy[j];
            copy[j] = temp;
          }
          return copy;
        };

        // แปลงข้อความแถว เช่น "x...x..." เป็นรายการ true/false
        Core.parseRow = function (text) {
          return String(text)
            .split('')
            .map(function (letter) {
              return letter === 'x';
            });
        };

        // แปลงรายการ true/false กลับเป็นข้อความแถว x กับ .
        Core.rowToString = function (row) {
          return row
            .map(function (on) {
              return on ? 'x' : '.';
            })
            .join('');
        };

        // ตารางว่างที่มีแถวตามรหัสที่ให้ ยาว beats × stepsPerBeat ช่อง
        Core.emptyGrid = function (trackIds, beats, stepsPerBeat) {
          var rows = {};
          trackIds.forEach(function (id) {
            var row = [];
            for (var i = 0; i < beats * stepsPerBeat; i++) row.push(false);
            rows[id] = row;
          });
          return { beats: beats, rows: rows };
        };

        // ทำสำเนาตาราง
        Core.copyGrid = function (grid) {
          var rows = {};
          Object.keys(grid.rows).forEach(function (id) {
            rows[id] = grid.rows[id].slice();
          });
          return { beats: grid.beats, rows: rows };
        };

        // สลับช่องหนึ่งช่อง คืนตารางใหม่ (ไม่แก้ตารางเดิม) ถ้าไม่มีแถวหรือช่องนั้นให้คืนสำเนาเดิม
        Core.toggle = function (grid, trackId, step) {
          var next = Core.copyGrid(grid);
          var row = next.rows[trackId];
          if (row && step >= 0 && step < row.length) row[step] = !row[step];
          return next;
        };

        // เปลี่ยนจำนวนจังหวะต่อห้อง: 4 เป็น 3 เก็บ 12 ช่องแรก 3 เป็น 4 เติมช่องว่างต่อท้าย
        Core.resize = function (grid, beats, stepsPerBeat) {
          var length = beats * stepsPerBeat;
          var rows = {};
          Object.keys(grid.rows).forEach(function (id) {
            var row = grid.rows[id].slice(0, length);
            while (row.length < length) row.push(false);
            rows[id] = row;
          });
          return { beats: beats, rows: rows };
        };

        // สร้างตารางจากจังหวะที่ตั้งไว้ แถวที่จังหวะนั้นไม่ได้เขียนไว้จะว่าง
        Core.gridFromGroove = function (groove, trackIds, stepsPerBeat) {
          var grid = Core.emptyGrid(trackIds, groove.beats, stepsPerBeat);
          trackIds.forEach(function (id) {
            if (typeof groove.rows[id] === 'string') grid.rows[id] = Core.parseRow(groove.rows[id]);
          });
          return grid;
        };

        // ตรวจจังหวะหนึ่งอัน คืนรายการปัญหาเป็นข้อความไทย (ว่างคือใช้ได้)
        Core.validateGroove = function (groove, trackIds, stepsPerBeat) {
          var problems = [];
          if (groove.beats !== 3 && groove.beats !== 4) problems.push(TEXT.grooveBadBeats);
          var length = groove.beats * stepsPerBeat;
          var anyHit = false;
          Object.keys(groove.rows).forEach(function (id) {
            var row = groove.rows[id];
            if (trackIds.indexOf(id) === -1) problems.push(fmt(TEXT.grooveUnknownTrack, { id: id }));
            if (typeof row !== 'string') {
              problems.push(fmt(TEXT.grooveBadChar, { id: id }));
              return;
            }
            if (row.length !== length) problems.push(fmt(TEXT.grooveBadLength, { id: id, n: row.length, m: length }));
            if (/[^x.]/.test(row)) problems.push(fmt(TEXT.grooveBadChar, { id: id }));
            if (row.indexOf('x') !== -1) anyHit = true;
          });
          if (!anyHit) problems.push(TEXT.grooveNoHit);
          return problems;
        };

        // เทียบตารางของผู้เล่นกับตารางโจทย์ แถวที่โจทย์ไม่มีถือว่าว่าง ช่องที่เกินมาในแถวนั้นนับเป็นช่องเกิน
        Core.compare = function (grid, target) {
          var ids = Object.keys(grid.rows);
          Object.keys(target.rows).forEach(function (id) {
            if (ids.indexOf(id) === -1) ids.push(id);
          });
          var result = { perfect: true, correct: 0, missing: [], extra: [] };
          ids.forEach(function (id) {
            var mine = grid.rows[id] || [];
            var goal = target.rows[id] || [];
            var length = Math.max(mine.length, goal.length);
            for (var step = 0; step < length; step++) {
              var has = mine[step] === true;
              var wants = goal[step] === true;
              if (has && wants) result.correct += 1;
              else if (wants) result.missing.push({ trackId: id, step: step });
              else if (has) result.extra.push({ trackId: id, step: step });
            }
          });
          result.perfect = result.missing.length === 0 && result.extra.length === 0;
          return result;
        };

        // ชื่อบอกตำแหน่งของช่องตามวิธีนับ เช่น ช่อง 6 ของจังหวะละสี่ช่องคือ "2และ"
        Core.stepName = function (step, stepsPerBeat, syllables) {
          var beat = Math.floor(step / stepsPerBeat) + 1;
          return String(beat) + (syllables[step % stepsPerBeat] || '');
        };

        // วิธีนับของแถวหนึ่ง เฉพาะช่องที่มีเสียง คั่นด้วย " · " แถวว่างได้ข้อความว่าง
        Core.countingText = function (row, stepsPerBeat, syllables) {
          var parts = [];
          row.forEach(function (on, step) {
            if (on) parts.push(Core.stepName(step, stepsPerBeat, syllables));
          });
          return parts.join(' · ');
        };

        // ความยาวของหนึ่งช่องเป็นมิลลิวินาที
        Core.stepMs = function (bpm, stepsPerBeat) {
          return 60000 / bpm / stepsPerBeat;
        };

        // ช่องที่ถึงเวลาเล่นเมื่อผ่านไป elapsedMs (นับต่อเนื่องไม่วน ผู้เรียกหารเศษเอง) ไม่เป็นลบ
        Core.stepIndexAt = function (elapsedMs, stepMs) {
          return Math.max(0, Math.floor(elapsedMs / stepMs));
        };

        // รหัสแถวที่มีเสียงในช่องที่ step (เรียงตามลำดับแถวในตาราง)
        Core.hitsAt = function (grid, step) {
          return Object.keys(grid.rows).filter(function (id) {
            return grid.rows[id][step] === true;
          });
        };

        // เลือกจังหวะที่ใช้ออกโจทย์ count อัน ไม่ซ้ำ จากระดับที่กำหนด
        // เรียงจากระดับง่ายไปยาก ในระดับเดียวกันเรียงแบบสุ่ม
        Core.pickRounds = function (grooves, level, count, rng) {
          var pool = grooves.filter(function (groove) {
            return level.grooveLevels.indexOf(groove.level) !== -1;
          });
          var chosen = Core.shuffle(pool, rng)
            .slice(0, count)
            .map(function (groove, index) {
              return { groove: groove, index: index };
            });
          chosen.sort(function (a, b) {
            return a.groove.level - b.groove.level || a.index - b.index;
          });
          return chosen.map(function (item) {
            return item.groove;
          });
        };

        // คะแนนของข้อที่ผ่าน: 0 ถ้าดูเฉลย ไม่เช่นนั้นลดตามจำนวนครั้งที่ตรวจไม่ผ่าน และเพิ่มโบนัสถ้าผ่านในครั้งแรก
        // streak คือจำนวนข้อที่ผ่านในครั้งแรกติดกัน โดยนับข้อนี้ด้วย
        Core.roundScore = function (failedChecks, revealed, streak, config) {
          if (revealed) return 0;
          var base = Math.max(config.minRoundPoints, config.roundPoints - failedChecks * config.checkPenaltyPoints);
          if (failedChecks > 0) return base;
          return base + config.firstTryBonusPoints * Math.min(streak, config.maxStreakBonus);
        };

        // ดาวของเกม: 3 ถ้าทุกข้อผ่านโดยไม่เคยตรวจไม่ผ่าน
        // 2 ถ้าไม่ดูเฉลยเลยและตรวจไม่ผ่านรวมไม่เกินจำนวนข้อ ไม่เช่นนั้น 1
        Core.stars = function (rounds) {
          var failed = 0;
          var revealed = 0;
          rounds.forEach(function (round) {
            failed += round.failedChecks;
            revealed += round.revealed ? 1 : 0;
          });
          if (revealed === 0 && failed === 0) return 3;
          return revealed === 0 && failed <= rounds.length ? 2 : 1;
        };

        // รหัสแถวที่มีเสียงอย่างน้อยหนึ่งช่อง
        Core.usedTracks = function (grid) {
          return Object.keys(grid.rows).filter(function (id) {
            return grid.rows[id].indexOf(true) !== -1;
          });
        };

        // แปลงตารางเป็นรูปแบบที่เก็บ: { beats, bpm, rows: { รหัสแถว: 'x.x.' } }
        Core.gridToSaved = function (grid, bpm) {
          var rows = {};
          Object.keys(grid.rows).forEach(function (id) {
            rows[id] = Core.rowToString(grid.rows[id]);
          });
          return { beats: grid.beats, bpm: bpm, rows: rows };
        };

        // อ่านรูปแบบที่เก็บกลับเป็นตาราง ถ้าข้อมูลเสียหายคืนค่าว่าง
        // แถวที่ไม่รู้จักถูกข้าม แถวที่สั้นหรือยาวถูกปรับให้พอดี
        Core.gridFromSaved = function (saved, trackIds, stepsPerBeat) {
          if (!saved || typeof saved !== 'object' || (saved.beats !== 3 && saved.beats !== 4)) return null;
          if (!saved.rows || typeof saved.rows !== 'object') return null;
          var grid = Core.emptyGrid(trackIds, saved.beats, stepsPerBeat);
          var length = saved.beats * stepsPerBeat;
          trackIds.forEach(function (id) {
            var text = saved.rows[id];
            if (typeof text !== 'string' || /[^x.]/.test(text)) return;
            var row = Core.parseRow(text).slice(0, length);
            while (row.length < length) row.push(false);
            grid.rows[id] = row;
          });
          return grid;
        };

        // ผลใหม่ดีกว่าสถิติที่เก็บไว้หรือไม่ (ผล 0 คะแนนไม่นับเป็นสถิติใหม่)
        Core.isBetter = function (result, old) {
          if (!old || typeof old !== 'object') return result.score > 0;
          return result.score > old.score;
        };

        // กฎของเหรียญ: แต่ละกฎรับ (ค่าของเหรียญ, ผลของเกมที่เพิ่งจบ, สถิติ, ข้อมูล) แล้วตอบว่าได้เหรียญหรือไม่
        Core.badgeRules = {
          solvedAtLeast: function (value, result, stats) {
            return stats.solved.length >= value;
          },
          allFirstTry: function (value, result) {
            var played = result.mode === 'copy' || result.mode === 'read';
            return played && result.rounds.length > 0 && result.rounds.every(function (round) {
              return round.failedChecks === 0 && !round.revealed;
            });
          },
          cleanMode: function (value, result) {
            return result.mode === value && result.rounds.length > 0 && result.rounds.every(function (round) {
              return !round.revealed;
            });
          },
          cleanHard: function (value, result) {
            return result.mode === value && result.level === 'hard' && result.rounds.length > 0 &&
              result.rounds.every(function (round) {
                return !round.revealed;
              });
          },
          solvedBeats: function (value, result, stats, data) {
            return data.GROOVES.some(function (groove) {
              return groove.beats === value && stats.solved.indexOf(groove.id) !== -1;
            });
          },
          solvedAll: function (value, result, stats, data) {
            return data.GROOVES.every(function (groove) {
              return stats.solved.indexOf(groove.id) !== -1;
            });
          },
          freeTracksAtLeast: function (value, result) {
            return result.mode === 'free' && result.tracksUsed >= value;
          }
        };

        // เล่นเกมจำลองด้วยตัวสุ่มที่กำหนด คืนผลเหมือนเหตุการณ์ gameEnd (ใช้ในการตรวจระบบ ไม่ใช้กับเกมจริง)
        // ข้อแรกตรวจไม่ผ่านหนึ่งครั้ง ข้อที่เหลือผ่านในครั้งแรก grooves คือรายการจังหวะที่ใช้ออกโจทย์
        Core.scriptedGame = function (mode, level, seed, config, grooves) {
          var rng = Core.makeRng(seed);
          var picked = Core.pickRounds(grooves, level, config.roundsPerGame, rng);
          var streak = 0;
          var score = 0;
          var rounds = picked.map(function (groove, index) {
            var failed = index === 0 ? 1 : 0;
            streak = failed === 0 ? streak + 1 : 0;
            score += Core.roundScore(failed, false, streak, config);
            return { grooveId: groove.id, failedChecks: failed, revealed: false };
          });
          return { mode: mode, level: level.id, score: score, stars: Core.stars(rounds), rounds: rounds };
        };

        /* ── ข้อสอบของปุ่ม "ตรวจระบบ": ทดสอบแกนเกมโดยไม่แตะสถานะของเกมที่กำลังเล่น ── */

        // เทียบค่าสองค่า ถ้าไม่เท่ากันให้หยุดพร้อมข้อความบอกว่าได้อะไรและควรได้อะไร
        function same(actual, expected, label) {
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            var detail = 'ได้ ' + JSON.stringify(actual) + ' ควรเป็น ' + JSON.stringify(expected);
            throw new Error((label ? label + ': ' : '') + detail);
          }
        }

        function check(condition, label) {

        // เพื่อให้การปรับตัวเลขในโซน B ไม่ทำให้ "ตรวจระบบ" ไม่ผ่านโดยไม่จำเป็น

        /* ═══════════ โซน D · หน้าจอและเสียง (ห้ามแก้ถ้าไม่จำเป็น) ═══════════ */
        /* ── ส่วนกลางของหน้าจอ: ทุกเกมใช้ชุดฟังก์ชันนี้ร่วมกัน ── */
        var handlers = {};
